version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - unconvert
  settings:
    gocritic:
      disabled-checks: [ifElseChain]
  exclusions:
    rules:
      - path: _test\.go
        linters: [noctx]
