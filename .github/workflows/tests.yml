name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *' # nightly, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the coverage report and the guide to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
          go vet ./...

      - name: Tests with the race detector
        id: tests
        continue-on-error: true
        run: |
          mkdir -p site
          go test -race -count=1 -timeout 120s -v \
            -coverpkg=./breaker,./chaos,./inventory,./orders -coverprofile=site/coverage.out ./... | tee site/tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Coverage report
        if: always()
        run: |
          go tool cover -html=site/coverage.out -o site/coverage.html
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=site/coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmarks
        if: always()
        run: |
          go test -run '^$' -bench . -benchmem ./... | tee site/bench.txt
          { echo '### Benchmarks'; echo '```'; cat site/bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        run: |
          cp docs/*.html site/ 2>/dev/null || true
          cp docs/go.html site/index.html
      - uses: peaceiris/actions-gh-pages@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

      - name: Lint
        if: always()
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz the reservation parser for 60 s
        run: go test ./inventory -run '^$' -fuzz FuzzParseReservation -fuzztime 60s
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: inventory/testdata/fuzz

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Every planted bug must be caught
        run: go run scripts/mutants.go | tee -a "$GITHUB_STEP_SUMMARY"
